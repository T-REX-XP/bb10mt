name: Native Go prerelease
on:
  push:
    tags: ['v*-go.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and verify
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes 7zip
          python3 scripts/vendor_runtime.py
          go run ./cmd/release --version "$RELEASE_VERSION" --output dist
          python3 scripts/verify_bundled_release.py dist
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/* --verify-tag --prerelease --title "BB10 MultiTool $RELEASE_VERSION" --notes-file docs/COMPATIBILITY.md
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
