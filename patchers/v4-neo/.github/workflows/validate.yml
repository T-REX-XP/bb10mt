name: v4-neo validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the pinned pack with its native executable
        shell: pwsh
        run: |
          $target = switch ($env:RUNNER_OS) { 'Windows' { 'windows-amd64' } 'Linux' { 'linux-amd64' } 'macOS' { 'darwin-arm64' } }
          $name = if ($env:RUNNER_OS -eq 'Windows') { 'bb10mt.exe' } else { 'bb10mt' }
          $tool = Join-Path (Join-Path 'bin' $target) $name
          if ($env:RUNNER_OS -ne 'Windows') { chmod +x $tool }
          & $tool patcher validate --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
