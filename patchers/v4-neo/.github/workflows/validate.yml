name: v4-neo validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B build.py validate
      - run: python -B -m unittest discover -s tests
      - run: python -B scripts/test_verify_real_build.py
      - run: python -B -m unittest discover -s foundation/tests -p test_patch_pack.py
      - run: python -B -m unittest discover -s foundation/tests -p test_qnx6_longnames.py
